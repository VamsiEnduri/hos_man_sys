{% extends "base.html" %}

{% block content %}

<style>
  .appt-container {
    max-width: 600px;
    margin: 80px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  .appt-container h2 {
    margin-bottom: 25px;
    color: #2c3e50;
    font-size: 26px;
  }

  .appt-actions {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
  }

  .appt-actions a {
    text-decoration: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    transition: all 0.3s ease;
  }

  .btn-book {
    background-color: #27ae60;
    color: white;
  }

  .btn-book:hover {
    background-color: #219150;
  }

  .btn-view {
    background-color: #2980b9;
    color: white;
  }

  .btn-view:hover {
    background-color: #1f6fa5;
  }
</style>

<div class="appt-container">
  <h2>Patient Appointments</h2>

  <div class="appt-actions">
    <a href="{% url 'book_appt' user.id %}" class="btn-book">
      Book Appointment
    </a>

    <a href="{% url 'my_appts' user.id %}" class="btn-view">
      My Appointments
    </a>
  </div>
</div>

{% endblock %}
